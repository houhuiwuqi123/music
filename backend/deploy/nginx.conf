# music.webtrc.eu.cc —— 经 Cloudflare 代理（橙云）的 HTTPS 站点。
# 宝塔面板：把两个 server 块的内容放进站点「配置文件」，或保存为 /www/server/panel/vhost/nginx/music.webtrc.eu.cc.conf。
# 证书路径按宝塔默认（站点 → SSL 部署后生成）；用其他方式签发的证书请改成实际路径。
# 单节点时这就是全部对外入口。以后加节点才需要 p2p.webtrc.eu.cc（tcp/udp 4001，不经过 nginx，见 p2p-domain.md）。

# 以下三行需要在 http 上下文里且只能定义一次（宝塔：/www/server/nginx/conf/nginx.conf 的 http {} 内）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format music_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=music_ws:10m rate=10r/s;

# 443（唯一对外端口）：Vue 网页（/）、浏览器 libp2p WebSocket（/ 且 Upgrade）、节点 HTTP API（/api/）、iOS 网关 WebSocket（/ws）
server {
    listen 443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /www/server/panel/vhost/cert/music.webtrc.eu.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/music.webtrc.eu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/music.webtrc.eu.cc.log music_safe;
    error_log /www/wwwlogs/music.webtrc.eu.cc.error.log;

    location = /ws {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # 浏览器的 libp2p WebSocket：js-libp2p 拨 /dns4/music.webtrc.eu.cc/tcp/443/wss，即 wss://music.webtrc.eu.cc/。
    # 同一个路径 "/" 上，带 Upgrade: websocket 的请求交给节点（127.0.0.1:4002），普通请求照常返回网页。
    # go-libp2p 的 websocket 监听不检查路径，所以不需要单独端口。
    location = / {
        error_page 418 = @libp2p;
        if ($http_upgrade ~* "^websocket$") { return 418; }
        root /www/wwwroot/webtrc/web/dist;
        try_files /index.html =404;
    }
    location @libp2p {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    # deploy.sh install 会把 web/dist 构建到这里
    location / {
        root /www/wwwroot/webtrc/web/dist;
        try_files $uri $uri/ /index.html;
    }
}
