# music.webtrc.eu.cc —— 经 Cloudflare 代理（橙云）的 HTTPS 站点。
# 宝塔面板：把两个 server 块的内容放进站点「配置文件」，或保存为 /www/server/panel/vhost/nginx/music.webtrc.eu.cc.conf。
# 证书路径按宝塔默认（站点 → SSL 部署后生成）；用其他方式签发的证书请改成实际路径。
# p2p.webtrc.eu.cc 不经过 nginx：节点间 tcp/udp 4001 由 Go 进程直接监听（见 p2p-domain.md）。

# 以下三行需要在 http 上下文里且只能定义一次（宝塔：/www/server/nginx/conf/nginx.conf 的 http {} 内）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format music_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=music_ws:10m rate=10r/s;

# 443：Vue 网页（/）、节点 HTTP API（/api/）、iOS 网关 WebSocket（/ws）
server {
    listen 443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /www/server/panel/vhost/cert/music.webtrc.eu.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/music.webtrc.eu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/music.webtrc.eu.cc.log music_safe;
    error_log /www/wwwlogs/music.webtrc.eu.cc.error.log;

    location = /ws {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # deploy.sh install 会把 web/dist 构建到这里
    location / {
        root /www/wwwroot/webtrc/web/dist;
        try_files $uri $uri/ /index.html;
    }
}

# 8443：浏览器的 libp2p WebSocket（js-libp2p 拨 /dns4/music.webtrc.eu.cc/tcp/8443/wss）。
# go-libp2p 的 websocket 监听不支持路径前缀，所以单独占一个端口；8443 是 Cloudflare 支持代理的 HTTPS 端口之一。
server {
    listen 8443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /www/server/panel/vhost/cert/music.webtrc.eu.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/music.webtrc.eu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/music.webtrc.eu.cc.p2p.log music_safe;

    location / {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
