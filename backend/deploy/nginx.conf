# Template only: place map/log_format/limit_req_zone in nginx's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format music_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=music_ws:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /etc/music-tls/fullchain.pem;
    ssl_certificate_key /etc/music-tls/privkey.pem;
    access_log /var/log/nginx/music-access.log music_safe;
    location = /ws {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /gateway/v2/ {
        client_max_body_size 1m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:8081/v2/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        send_timeout 30s;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name gateway.example.com;
    ssl_certificate /etc/music-tls/fullchain.pem;
    ssl_certificate_key /etc/music-tls/privkey.pem;
    access_log /var/log/nginx/music-gateway-access.log music_safe;
    client_max_body_size 1m;
    client_body_timeout 30s;
    location /v2/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        send_timeout 30s;
    }
    location / { return 404; }
}
