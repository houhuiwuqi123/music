# Template only: place map/log_format/limit_req_zone in nginx's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format music_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=music_ws:10m rate=10r/s;

# HTTPS: Vue app, node HTTP API (bootstrap list / ICE / region) and the iOS gateway WebSocket.
server {
    listen 443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /etc/music-tls/fullchain.pem;
    ssl_certificate_key /etc/music-tls/privkey.pem;
    access_log /var/log/nginx/music-access.log music_safe;

    location = /ws {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Built Vue app (web/dist). Alternatively start the node with -web-dir and proxy / to 8080.
    location / {
        root /www/wwwroot/webtrc/web/dist;
        try_files $uri $uri/ /index.html;
    }
}

# libp2p WebSocket transport for browsers (js-libp2p dials /dns4/music.webtrc.eu.cc/tcp/8443/wss).
# go-libp2p's websocket listener has no path prefix, so it gets its own port.
# 8443 is one of the HTTPS ports Cloudflare proxies.
server {
    listen 8443 ssl;
    server_name music.webtrc.eu.cc;
    ssl_certificate /etc/music-tls/fullchain.pem;
    ssl_certificate_key /etc/music-tls/privkey.pem;
    access_log /var/log/nginx/music-p2p-access.log music_safe;
    location / {
        limit_req zone=music_ws burst=50 nodelay;
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
